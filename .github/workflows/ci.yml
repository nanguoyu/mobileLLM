name: CI

# Fast tests cover all five packages that build under plain SwiftPM without Metal or vendored artifacts.
# A second, cached integration job builds the pinned llama.cpp XCFramework on a cache miss, then proves the
# generated app project for both shipped platforms and every engine test target with xcodebuild. No
# signing identity or repository secret is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-harness-verification:
    name: agent harness specification gate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Validate verification JSON and test plans
        run: |
          find Verification/AgentHarness -type f \( -name '*.json' -o -name '*.xctestplan' \) -print0 \
            | xargs -0 -n1 jq empty
          bash -n scripts/verification/reset-agent-test-container.sh
          bash -n scripts/verification/run-agent-package-coverage.sh

      - name: Test the verification gate
        run: swift test --package-path Tools/AgentHarnessVerification

      - name: Enforce static requirement traceability
        run: >-
          swift run --package-path Tools/AgentHarnessVerification
          agent-harness-verify static
          --repo-root "$GITHUB_WORKSPACE"

  agent-package-coverage:
    name: ${{ matrix.package }} coverage evidence
    needs: agent-harness-verification
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - AgentContracts
          - AgentRuntime
          - AgentSandboxAPI
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version

      - name: Resolve changed-lines base
        id: coverage-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero_sha='0000000000000000000000000000000000000000'
          if [[ -n "${PR_BASE_SHA:-}" ]] && git cat-file -e "${PR_BASE_SHA}^{commit}"; then
            base_sha="$PR_BASE_SHA"
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]] \
              && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"; then
            base_sha="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
          else
            base_sha="$(git rev-parse HEAD)"
          fi
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Test once and enforce package coverage
        timeout-minutes: 18
        run: |
          bash scripts/verification/run-agent-package-coverage.sh \
            --package "${{ matrix.package }}" \
            --base-ref "${{ steps.coverage-base.outputs.base-sha }}" \
            --output-dir "$RUNNER_TEMP/agent-package-coverage"

      - name: Upload normalized coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-package-coverage
          if-no-files-found: error
          retention-days: 14

  test:
    name: swift test (${{ matrix.package }})
    needs: agent-harness-verification
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - AppUI
          - AppRuntime
          - LLMCore
          - MobileLLMUI
          - LLMEngineApple
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        # /Applications/Xcode.app is the runner image's default (latest stable) Xcode. Bump the runner
        # image (macos-15 → newer) to move to a newer default toolchain.
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Test package
        run: swift test --package-path "Packages/${{ matrix.package }}"

  build-app-and-engines:
    name: xcodebuild (app + engines)
    needs: [test, agent-package-coverage]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Install project tools
        run: |
          brew install xcodegen
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi

      - name: Cache pinned llama.cpp XCFramework
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: Packages/LLMEngineLlama/Vendor/llama.xcframework
          key: llama-xcframework-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama-xcframework.sh') }}

      - name: Build pinned llama.cpp XCFramework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-llama-xcframework.sh

      - name: Verify vendor artifact
        run: test -f Packages/LLMEngineLlama/Vendor/llama.xcframework/Info.plist

      - name: Generate unsigned project
        run: |
          cp Signing.xcconfig.example Signing.xcconfig
          xcodegen generate
          xcodebuild -project mobileLLM.xcodeproj -scheme UITests -showTestPlans
          xcodebuild -project mobileLLM.xcodeproj -scheme DeviceE2E -showTestPlans

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project mobileLLM.xcodeproj \
            -scheme mobileLLM \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            MTL_COMPILER_FLAGS='$(inherited) -Wno-c++17-extensions -Wno-c++20-extensions' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project mobileLLM.xcodeproj \
            -scheme mobileLLM \
            -destination 'generic/platform=iOS' \
            -skipMacroValidation \
            MTL_COMPILER_FLAGS='$(inherited) -Wno-c++17-extensions -Wno-c++20-extensions' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test MLX, llama.cpp, and Apple engines
        run: |
          xcodebuild test \
            -project mobileLLM.xcodeproj \
            -scheme EngineTests \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            MTL_COMPILER_FLAGS='$(inherited) -Wno-c++17-extensions -Wno-c++20-extensions' \
            CODE_SIGNING_ALLOWED=NO
