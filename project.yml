# XcodeGen spec — regenerate the .xcodeproj with `xcodegen generate`.
# The project is not committed; the packages + this spec are the source of truth. Signing.xcconfig is
# local-only and supplies signing credentials, not project identity.
#
# Run the engine unit tests (they can't build under plain `swift test` — the MLX package's HF macros
# need xcodebuild -skipMacroValidation):
#   xcodegen generate
#   xcodebuild -skipMacroValidation -scheme EngineTests -destination 'platform=macOS,arch=arm64' test
name: mobileLLM
options:
  bundleIdPrefix: wang.wangdongdong
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.42.0"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

packages:
  AppUI: { path: Packages/AppUI }
  AppRuntime: { path: Packages/AppRuntime }
  LLMCore: { path: Packages/LLMCore }
  AgentContracts: { path: Packages/AgentContracts }
  AgentRuntime: { path: Packages/AgentRuntime }
  AgentSandboxAPI: { path: Packages/AgentSandboxAPI }
  LLMEngineMLX: { path: Packages/LLMEngineMLX }
  LLMEngineLlama: { path: Packages/LLMEngineLlama }
  LLMEngineApple: { path: Packages/LLMEngineApple }
  MobileLLMUI: { path: Packages/MobileLLMUI }

targets:
  mobileLLM:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Per-platform entitlements: the iOS file keeps the increased-memory-limit; macOS App Store needs
        # App Sandbox + the network-client exception (downloads / MCP / Wikipedia) instead.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/mobileLLM.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/mobileLLM.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/mobileLLM-macOS.entitlements
        # Canonical app identity. Keep this in the generated project's source of truth so local signing
        # files cannot silently substitute a different identifier.
        PRODUCT_BUNDLE_IDENTIFIER: wang.wangdongdong.mobileLLM
        SWIFT_VERSION: "6.0"
        # The executable lives at the app root on iOS but under Contents/MacOS on macOS. Keep both
        # runpaths so package frameworks embedded in the platform-standard Frameworks directory resolve
        # when the built Mac app is launched outside Xcode as well as when the iPhone app launches.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # App Store submission: declares no non-exempt encryption, so it skips the export-compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: mobileLLM
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Support all four orientations so the universal iOS target remains compatible with iPad
        # Split View / Slide Over and passes App Store orientation validation without requiring full screen.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Usage strings for the chat workstream's dictation feature (Speech + microphone).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "mobileLLM uses the microphone so you can dictate messages."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "mobileLLM uses speech recognition to turn your dictation into text."
        INFOPLIST_KEY_NSCameraUsageDescription: "mobileLLM uses the camera so you can photograph something and ask the model about it."
        # Tool-suite usage strings (chat Tools menu / Settings → Choose tools). Access is requested when you select
        # the tool — never at launch or merely from the master switch. Plain one-liners naming what it can do.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "mobileLLM lets the model add and read calendar events while answering you, and only if you select the calendar tool."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "mobileLLM lets the model create reminders while answering you, and only if you select the reminders tool."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "mobileLLM lets the model use your approximate location while answering you, and only if you select the location tool."
    dependencies:
      - package: MobileLLMUI
      - package: LLMEngineMLX
        product: LLMEngineMLX
      - package: LLMEngineLlama
        product: LLMEngineLlama
      # Apple's system model (FoundationModels). The framework is iOS 26 / macOS 26 and weak-links, so
      # this builds and runs on the app's lower deployment targets — the engine just reports the system
      # model as unavailable there.
      - package: LLMEngineApple
        product: LLMEngineApple
      - package: AppRuntime
      - package: AgentRuntime
        product: AgentRuntime
      - package: AgentContracts
        product: AgentContracts

  # UI regression tests (iOS simulator): the keyboard/composer geometry that burned four blind fixes —
  # asserted with XCUITest instead of eyeballs. Run:
  #   xcodebuild -skipMacroValidation -scheme UITests -destination 'platform=iOS Simulator,name=iPhone 16 Pro' test
  mobileLLMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Test runners keep distinct generic identifiers; the app's canonical bundle identifier is
        # intentionally versioned through `options.bundleIdPrefix` above.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mobileLLMUITests
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: mobileLLM

  # Signed, serial, physical-iPhone production-path coverage. Kept in its own source tree so the old
  # simulator keyboard suite and its seeded fixture can never join a clean-install device run.
  mobileLLMDeviceE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DeviceUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mobileLLMDeviceE2ETests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
    dependencies:
      - target: mobileLLM

schemes:
  # The app scheme is declared explicitly because defining any scheme below turns off Xcode's implicit
  # per-target scheme (otherwise `-scheme mobileLLM` disappears).
  mobileLLM:
    build:
      targets:
        mobileLLM: all
  # Engine unit tests that the plain `swift test` loop can't build (the MLX package's HF load macros).
  # `test.targets` references the local package test targets with xcodegen's `package:` form; `build`
  # needs a real project target, so it builds the app (which links both engine packages).
  # Prove: xcodebuild -skipMacroValidation -scheme EngineTests -destination 'platform=macOS,arch=arm64' test
  EngineTests:
    build:
      targets:
        mobileLLM: [test]
    test:
      targets:
        - package: LLMEngineMLX/LLMEngineMLXTests
        - package: LLMEngineLlama/LLMEngineLlamaTests
        # LLMEngineApple's tests also run under plain `swift test` (they're pure + framework-free); they
        # ride along here so one scheme covers every engine.
        - package: LLMEngineApple/LLMEngineAppleTests
  # The keyboard/composer geometry tests. Simulator-only (XCUITest drives real taps + the software
  # keyboard); needs a small GGUF pre-seeded in the app container — see UITests/KeyboardUITests.swift.
  UITests:
    build:
      targets:
        mobileLLM: all
    test:
      testPlans:
        - path: Verification/AgentHarness/TestPlans/SimulatorUI.xctestplan
          defaultPlan: true
  # Full clean-install/download/inference matrix. Run only on the connected phone, with one worker and
  # no randomized ordering because the provisioning phase intentionally creates the model artifacts.
  DeviceE2E:
    build:
      targets:
        mobileLLM: [test]
    test:
      config: Debug
      testPlans:
        - path: Verification/AgentHarness/TestPlans/DeviceE2E.xctestplan
          defaultPlan: true
